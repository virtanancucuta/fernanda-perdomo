server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Easypanel/Traefik termina el TLS; no exponer versión de nginx
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTML: siempre revalidar
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Estáticos: caché larga (css/js llevan ?v= en index.html para invalidar)
    location ~ ^/(assets|css|js)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cualquier ruta inexistente muestra la landing (status 404)
    error_page 404 /index.html;
}
